/*
 * Best-effort Forge 1.20.1 build script for the restored EixClient/Naven source tree.
 *
 * IMPORTANT: this file is a STARTING POINT, not a verified build. The decompiled tree
 * still contains obfuscation artifacts (see ../ANALYSIS/README-analysis.md), so a plain
 * `gradle build` will not succeed without the manual fixes listed in that document.
 * The scaffold was never executed here: Minecraft/Forge/Skija artifacts are not present
 * on this machine and cannot be fetched offline.
 */

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '9.3'
group = 'com.heypixel.heypixelmod'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    // MCPConfig for 1.20.1, the same artifact the shipped jar's SRG names came from.
    mappings channel: 'official', version: '1.20.1'
    copyAccessAtTransformers = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { naven { source sourceSets.main } }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'

    // Bundled at runtime by the original jar under META-INF/jarjar/ (see ../../BUNDLED-LIBRARIES).
    // The restored sources import these with their ORIGINAL package names.
    implementation files(
        'lib/skija-shared-0.116.4.jar',
        'lib/skija-windows-x64-0.116.4.jar',
        'lib/types-0.2.0.jar',
        'lib/aio-core-1.5.38.jar',
        'lib/jlayer-1.0.1.4.jar',
        'lib/jorbis-0.0.17.4.jar',
        'lib/mp3spi-1.9.5.4.jar',
        'lib/tritonus-share-0.3.7.4.jar',
        'lib/vorbisspi-1.0.3.3.jar'
    )

    // Compile-time-only annotations that survived in the class files.
    compileOnly 'org.projectlombok:lombok:1.18.30'
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'EixClient',
            'Specification-Vendor'    : 'jiuxian_baka',
            'Specification-Version'   : '1',
            'Implementation-Title'    : 'EixClient',
            'Implementation-Version'  : '9.3',
            'Implementation-Vendor'   : 'jiuxian_baka',
            'MixinConfigs'            : 'EixClient.mixins.json'
        ])
    }
}
